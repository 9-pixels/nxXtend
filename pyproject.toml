[project]
name = "nx"
version = "0.1"
description = "Interactive NixOS package manager"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "requests",
    "rich",
    "readchar"
]

[project.scripts]
nx = "main:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.backends.legacy:build"